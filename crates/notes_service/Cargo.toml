[package]
name = "notes_service"
version = "0.1.0"
edition = "2024"

[dependencies]
shared = { path = "../shared" }
sqlx = { version="0.8.6", features = ["runtime-tokio", "sqlite", "macros"] }
async-trait = "0.1.89"
axum = "0.8.7"
http = "1.4.0"
serde_json = "1.0.145"
utoipa = { version = "5.4.0", features = ["axum_extras"] }
utoipa-swagger-ui = { version = "9.0.2", features = ["axum"] }
serde = { version = "1.0.228", features = ["derive"] }
