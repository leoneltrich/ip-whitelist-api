events {
    worker_connections 1024;
}

http {
    upstream auth_service {
        server auth_service:3000;
    }

    upstream firewall_service {
        server firewall_service:3001;
    }

    server {
        listen 80;

        # --- Auth Service Routes ---
        location /login {
            proxy_pass http://auth_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
        
        location /token {
            proxy_pass http://auth_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # Be specific to avoid conflicts
        location /admin/users {
            proxy_pass http://auth_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
        
        location /users/profile {
            proxy_pass http://auth_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /auth/health {
            proxy_pass http://auth_service/health;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # --- Firewall Service Routes ---
        location /admin/servers {
            proxy_pass http://firewall_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
        
        location /users/access {
            proxy_pass http://firewall_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
        
        location /users/servers {
            proxy_pass http://firewall_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /health {
            proxy_pass http://firewall_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # --- Swagger UI ---
        # Expose Auth docs at /auth/swagger-ui/
        location /auth/swagger-ui/ {
            rewrite ^/auth/swagger-ui/(.*) /swagger-ui/$1 break;
            proxy_pass http://auth_service;
        }
        
        location /auth/api-docs/ {
             rewrite ^/auth/api-docs/(.*) /api-docs/$1 break;
             proxy_pass http://auth_service;
        }

        # Expose Firewall docs at /firewall/swagger-ui/
        location /firewall/swagger-ui/ {
            rewrite ^/firewall/swagger-ui/(.*) /swagger-ui/$1 break;
            proxy_pass http://firewall_service;
        }
        
        location /firewall/api-docs/ {
             rewrite ^/firewall/api-docs/(.*) /api-docs/$1 break;
             proxy_pass http://firewall_service;
        }
    }
}
