services:
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - auth_service
      - firewall_service

  auth_service:
    build:
      context: .
      target: auth_service
    environment:
      - DATABASE_PATH=/data/auth.db
      - PRIVATE_KEY_PATH=/secrets/private.pem
      - PUBLIC_KEY_PATH=/secrets/public.pem
    volumes:
      - ./data:/data
      - ./private.pem:/secrets/private.pem:ro
      - ./public.pem:/secrets/public.pem:ro
    labels:
      - "mesh1.proxy.enable=true"                  # REQUIRED: Enables discovery
      - "mesh1.proxy.port=3000"                    # Internal port (default: 3000)
      - "mesh1.proxy.spec_path=/api-docs/openapi.json" # Path to JSON spec (default: /api-docs/openapi.json)

  firewall_service:
    build:
      context: .
      target: firewall_service
    environment:
      - DATABASE_PATH=/data/firewall.db
      - PUBLIC_KEY_PATH=/secrets/public.pem
      - FIREWALL_BACKEND=mock
    volumes:
      - ./data:/data
      - ./public.pem:/secrets/public.pem:ro
    labels:
      - "mesh1.proxy.enable=true"                  # REQUIRED: Enables discovery
      - "mesh1.proxy.port=3001"                    # Internal port (default: 3000)
      - "mesh1.proxy.spec_path=/api-docs/openapi.json" # Path to JSON spec (default: /api-docs/openapi.json)
